global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'beekod-app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/health'
    params:
      format: ['prom']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Example for Redis exporter if added
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
