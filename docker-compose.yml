version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: beekod-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Emreemir21."
      MYSQL_DATABASE: ${DB_NAME}
      DB_PASSWORD: "Emreemir21."
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "3306:3306"
    networks:
      - beekod-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: beekod-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Redis password is required!}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    # ⚠️ PRODUCTION: Port'u dış dünyaya AÇMA!
    # Sadece container network'ü içinde erişilebilir
    expose:
      - "6379"
    # Development için gerekirse uncomment et:
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - beekod-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beekod-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=3000
      - ADMIN_KEY=${ADMIN_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beekod-network
    volumes:
      - backend_logs:/app/logs
      - backend_storage:/app/storage
      - backend_temp:/app/temp
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./BeekodFrontend
      dockerfile: Dockerfile
    container_name: beekod-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - beekod-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  beekod-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_storage:
    driver: local
  backend_temp:
    driver: local