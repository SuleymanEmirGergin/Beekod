name: Product CI

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Backend validation
  backend-validate:
    name: Backend - Validate & Build
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: beekod_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run Backend Tests
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: beekod_test
          NODE_ENV: test

      - name: Build Backend
        run: npm run build

  # Frontend validation
  frontend-validate:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./BeekodFrontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./BeekodFrontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./BeekodFrontend/build
          retention-days: 7

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Frontend Security Audit
        working-directory: ./BeekodFrontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # E2E Tests (only on PR)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-validate]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./BeekodFrontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./BeekodFrontend
        run: npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: npm start &
        env:
          NODE_ENV: test
          PORT: 3001

      - name: Start Frontend Dev Server
        working-directory: ./BeekodFrontend
        run: npm run dev &

      - name: Wait for servers
        run: sleep 10

      - name: Run E2E Tests
        working-directory: ./BeekodFrontend
        run: npx playwright test --reporter=html
        continue-on-error: true

      - name: Upload E2E Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./BeekodFrontend/playwright-report
          retention-days: 30

  # Docker build (dry run)
  docker:
    name: Docker Build (Dry Run)
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-validate]
    if: github.event_name == 'pull_request' 
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: beekod-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./BeekodFrontend
          push: false
          tags: beekod-frontend:test
