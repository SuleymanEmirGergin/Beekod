name: Product CI

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: beekod_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true # Don't block build on lint errors for now

      - name: Run Tests
        run: npm test
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_USER: root
            DB_PASSWORD: test_password
            DB_NAME: beekod_test
            NODE_ENV: test

      - name: Build Project
        run: npm run build

  docker:
    name: Docker Build (Dry Run)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' 
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Just verify buildability
          tags: beekod-backend:test
